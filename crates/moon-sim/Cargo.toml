[package]
name = "moonpark-sim"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "rlib"]
[features]
contract = ["dep:borsh"]
[dependencies]
borsh = { version = "1", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
