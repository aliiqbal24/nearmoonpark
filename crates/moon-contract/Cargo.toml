[package]
name = "moonpark-contract"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
near-sdk = { version = "5", features = ["legacy"] }
moonpark-sim = { path = "../moon-sim", features = ["contract"] }
serde_json = "1"
[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing", "legacy"] }
